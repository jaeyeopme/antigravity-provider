[project]
name = "antigravity-provider"
dynamic = ["version"]
description = "Unofficial Hermes Agent provider for Google Antigravity: use your account's Gemini, Claude, and gpt-oss models with no API key or proxy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "antigravity_provider.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
