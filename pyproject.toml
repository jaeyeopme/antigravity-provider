[project]
name = "antigravity-provider"
dynamic = ["version"]
description = "Unofficial Hermes Agent provider for Google Antigravity: use the Gemini, Claude, and gpt-oss models your Antigravity account offers, with no API key or proxy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jaeyeopme" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/jaeyeopme/antigravity-provider"
Changelog = "https://github.com/jaeyeopme/antigravity-provider/blob/main/CHANGELOG.md"
Issues = "https://github.com/jaeyeopme/antigravity-provider/issues"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "antigravity_provider.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# ruff format wraps code; comments and strings may run long.
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
