name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . && python -m unittest discover -v

  # Installs a fresh Hermes on a throwaway runner, so the real plugin install and agent turn are
  # checked without touching anyone's own Hermes.
  hermes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - if: runner.os != 'Windows'
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The runner's C: drive is far slower than D: (actions/runner-images#8755), so Hermes and the
      # temp files go on D:.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HERMES_HOME = "D:\hermes"
          $env:TEMP = $env:TMP = $env:RUNNER_TEMP
          "HERMES_HOME=$env:HERMES_HOME", "TEMP=$env:TEMP", "TMP=$env:TMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & ([scriptblock]::Create((Invoke-RestMethod https://hermes-agent.nousresearch.com/install.ps1))) -NonInteractive -SkipBrowser -SkipComputerUse
          "$env:HERMES_HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: hermes --version
      # The script skips the install check when Hermes cannot report its runtime; here that must fail.
      - run: |
          set -o pipefail
          scripts/validate_hermes.sh | tee validate.log
          grep -q 'directory plugin install and CLI registration ok' validate.log
      - run: python scripts/run_in_hermes.py scripts/e2e_hermes.py
